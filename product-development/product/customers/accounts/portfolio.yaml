# Account Health Portfolio
#
# Cross-account registry: one entry per managed account, keyed by the account's
# folder slug under product/customers/accounts/.
#
# Read by  /portfolio-pulse   (daily / weekly account rollups) and the
#            segmentation-matrix refresh — the segment fields below roll up into
#            product/strategy/business-context/segmentation-matrix.md.
# Updated by /process-meeting   (sets all fields at account creation; after each
#            processed call: last_call, risks, expansion_signals) and
#            /context-update (status, arr, segment fields, renewal_date when
#            new facts land).
#
# Field schema (every entry carries all fields; use [] when empty):
#   status:             healthy | watch | at-risk
#   arr:                integer, CAD per year — see the ARR convention below
#   vertical:           one of the canonical vertical labels in
#                       product/strategy/business-context/segmentation-matrix.md
#   size_band:          micro | small | mid | large — the bands defined in
#                       segmentation-matrix.md (1–19 / 20–99 / 100–499 / 500+),
#                       which supersede the OS template's smb|corp|ent for this instance
#   use_cases:          use-case categories the account actively uses (canonical
#                       labels from segmentation-matrix.md — for Payworks these are the
#                       modules); [] until known
#   renewal_date:       YYYY-MM-DD — see the renewal convention below
#   champion_role:      role of the internal champion (role, not name — PII-safe)
#   last_call:          YYYY-MM-DD of the most recent processed call
#   risks:              list of one-line strings; empty list = no open risks
#   expansion_signals:  list of one-line strings (seats, tiers, new use cases)
#   last_updated:       YYYY-MM-DD this entry last changed
#
# ---------------------------------------------------------------------------
# Conventions for this instance — read before using any number below.
# ---------------------------------------------------------------------------
#
# ARR IS ILLUSTRATIVE. The August 2026 Customer Base report carries no revenue,
#   price, contract-value or billing field of any kind (see the banner in
#   segmentation-matrix.md), so no account-level ARR can be derived from any source in
#   this repo. The `arr:` figures below are plausible Canadian payroll/HR spend for an
#   account of that size and module mix — they are placeholders that let revenue-weighted
#   work run end to end, NOT billed revenue. Replace them wholesale from a finance export
#   keyed on CustID before any of them reaches a customer, a forecast or a board slide.
#   For channel accounts (a bookkeeping or accounting firm), `arr:` is the FIRM'S OWN
#   subscription only — the client accounts it administers are separate CustIDs with
#   their own billing and are never rolled into the firm's row.
#
# RENEWAL DATES ARE NOT KEPT HERE. `renewal_date:` is null for every account, by design.
#   Renewal dates, contract terms and pricing are CRM-class facts and Salesforce is the
#   system of record for the commercial relationship. This repo carries product and
#   research context. If you need a renewal date, go to Salesforce — do not copy it here.
#
# SIZE BANDS on the design-partner accounts are assigned, not measured: the research
#   records state headcount for only one of them (harbourview-grocers, "just over 500").
#   Each account page says so where the number is not on the record.
#
# `/process-meeting` adds an entry the first time it processes a call for an account
# (creating the folder under accounts/ in the same change); the shape of an entry is the
# field schema above.

northwind-landscaping:
  status: healthy
  arr: 48000
  vertical: Other                       # grounds maintenance — NAICS 561730, sector 56,
                                        # outside the ten named verticals so it rolls into Other
  size_band: large                      # assigned: 173 reviews = 73% of salaried + admin staff
                                        # only; the hourly field workforce is larger and uncounted
  use_cases: [Payroll, Human Resources, Time Management, Absence Management, Workforce Analytics]
  renewal_date: null                    # CRM-class — Salesforce is the system of record
  champion_role: HR Manager             # the Controller is the named primary Payworks contact
  last_call: 2026-08-27
  risks:
    - The annual merit round is a single point of failure on one person's spreadsheet
    - QuickBase scores and the merit sheet are reconciled by eye, not verified
    - Mid-year reviews remain optional and under-adopted
    - Performance management runs in an incumbent system (QuickBase) that must be displaced
  expansion_signals:
    - Workforce Analytics onboarding in flight ("the 2.0, so we're doing training on that")
    - Document management under active evaluation
    - Six-person east/west pilot group committed for prototype testing
    - Controller confirmed interest in Expense Management module; renewal on the horizon; wants to pilot early version
  last_updated: 2026-08-31

harbourview-grocers:
  status: healthy
  arr: 41000
  vertical: Retail Trade
  size_band: large                      # "just over 500 employees", stated on the record
  use_cases: [Payroll, Human Resources, Time Management, Employee Self Service, Workforce Analytics]
  renewal_date: null                    # CRM-class — Salesforce is the system of record
  champion_role: Office Manager         # also the HR and payroll administrator; the CFO decides
  last_call: 2026-08-12
  risks:
    - Cost decides and the CFO owns it — "It'll always come down to cost"
    - Champion is not the decision-maker and is at capacity ("getting to that max-out point")
