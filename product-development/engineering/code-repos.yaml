# Code Repos
#
# Registry of the product code repositories this team reasons about — Tier 0 of
# code grounding: which repo covers what, where its entry points are, and how
# fresh our knowledge of it is. The access-tier chain, citation format, and
# honesty rules live in code-grounding.md next to this file — that contract
# governs every claim made from these repos; do not restate it here.
#
# Conventions
# - Register the repos PMs actually ask about. Skip infra/tooling repos.
# - NO local paths and NO tokens in this file, ever (privacy contract). Where a
#   clone lives is machine-local: each teammate grants read access via
#   permissions.additionalDirectories in the gitignored
#   .claude/settings.local.json (guide: os-installation/claude-code/code-access.md,
#   or just run /connect-code). Clone under the repo slug name so sessions can
#   match a grant to its registry entry.
# - remote: https URL. Any git host works for local access; the GitHub MCP
#   fallback tier is GitHub-only.
# - purpose: one sentence — what this repo is.
# - covers: free-text product-area keywords IN YOUR TEAM'S OWN LANGUAGE — the
#   primary signal /code-qa uses to route a question to a repo. Use whatever
#   abstraction you actually speak; it need not match feature-index granularity.
# - access_tier: local | github-mcp | map-only | none — the best tier set up
#   anywhere on the team. Each session verifies its own machine and degrades
#   honestly.
# - clone_command: OPTIONAL — only when the default
#   `git clone --filter=blob:none <remote>` isn't right. Monorepos: add
#   --sparse and set the sparse-checkout dirs. Never --depth=1 for a
#   persistent clone — it breaks the git-history playbooks (why-this-way,
#   is-it-in-production).
# - deployed_ref: OPTIONAL — a ref your release process already maintains: a
#   release branch (origin/release/production) or a tag pattern ("tag: prod-*").
#   Enables "is this in production?" answers. Omit if none exists — answers
#   then say "deployment status unknown".
# - entry_points: name → repo-relative path + one-liner. Hints, not contracts —
#   the explorer verifies before relying on them.
# - exclude: globs explorers skip (vendored deps, generated code).
# - feature_keys: OPTIONAL — feature-index.yaml keys this repo implements.
#   Most teams' feature granularity won't match repo boundaries — leave it out
#   rather than force it; /code-qa never requires it.
# - map: OPTIONAL — SHA-stamped table of contents generated by /connect-code,
#   only for repos where grep-first navigation is painful (monorepos, >12
#   top-level dirs). path is engineering-relative (this file lives in
#   engineering/, so start with codebases/...). Maps route, never prove.
# - last_validated: YYYY-MM-DD someone confirmed remote/covers/entry_points
#   still match reality. /wiki-lint flags entries older than 90 days.

# No repos registered yet. Run /connect-code to add the first one — it writes the
# entry here (and, for a large repo, the SHA-stamped map under codebases/).
#
# Shape of an entry, for reference:
#
#   my-app:
#     remote: https://github.com/your-org/my-app
#     default_branch: main
#     language: TypeScript (Next.js web + Node services)
#     purpose: one sentence — what this repo is
#     covers: free-text product-area keywords in your team's own language
#     access_tier: local          # local | github-mcp | map-only | none
#     deployed_ref: "tag: prod-*" # optional — enables "is this in production?"
#     entry_points:
#       web: apps/web/app/ — customer-facing pages
#     exclude:
#       - "**/node_modules/**"
#     last_validated: YYYY-MM-DD
#
# A minimal entry is just remote + purpose + covers + access_tier + last_validated.

repos: {}
