    name: Human Resources
    description: The employee lifecycle — records, documents, benefits and talent, hire to retire — for HR admins and people leaders. (payworks.ca/solutions/human-resources)
    features:

      employee-records:
        name: Employee Records
        status: live
        description: One employee file — employment, personal, pay, compensation and benefits — shared across every module.

      online-filing-cabinet:
        name: Online Filing Cabinet
        status: live
        description: Cloud storage for employee documents and company property records.

      document-e-signature:
        name: Documents & e-Signature
        status: live
        description: Company policy documents shared with Read & Acknowledge and e-signature.

      onboarding-checklists:
        name: Onboarding Checklists
        status: live
        description: Configurable onboarding checklists and a welcome email that share company documents with new hires.

      performance-and-talent-tracking:
        name: Performance & Talent Tracking
        status: live
        description: Employee skills, education, certifications and licences, plus review and disciplinary documentation.

      benefit-plans:
        name: Benefit Plan Administration
        status: live
        description: Benefit plan setup, rate charts, mass enrollment and retirement plans.

      org-structure:
        name: Organization Structure
        status: live
        description: Companies, divisions and locations with positions, job profiles and group codes.

      org-chart:
        name: Organizational Chart
        status: live
        description: Visual employee-to-employee reporting chart of the organization.

      union-labour-relations:
        name: Union & Labour Relations
        status: live
        description: Union and labour-relations configuration on the employee and organization record.

      hr-notifications:
        name: HR Notifications
        status: live
        description: Pre-defined and scheduled notices raised when employee information changes.

      offboarding:
        name: Offboarding
        status: live
        description: Offboarding and layoff history kept on the employee record.

      applicant-tracking:
        name: Applicant Tracking
        status: live
        description: Recruitment managed in one place — job posting, hiring workflows, email templates and interview scheduling, feeding the new-hire process.

      recruiting:
        name: Recruiting (HR 3.0)
        status: planned
        description: Roadmap HR 3.0 item; scope beyond today's Applicant Tracking not detailed in the seeding sources.

      compensation-management:
        name: Compensation Management (HR 4.0)
        status: planned
        description: Roadmap HR 4.0 item — compensation management, named a wallet-share expansion module in the FY27 strategy.

      learning-management:
        name: Learning Management (HR 5.0)
        status: planned
        description: Roadmap HR 5.0 item — a learning management system.

      hr-foundations:
        name: HR Foundations
        status: planned
        description: Roadmap shared foundation — position/occupation, effective dating, and skills & certifications.

