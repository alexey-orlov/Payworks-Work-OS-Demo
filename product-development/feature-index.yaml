        description: Roadmap shared foundation — effective dating, one stat calculation, retro-pay, locations and teams.

  absence-management:
    name: Absence Management
    description: Time off from request to payroll with no rekeying — for employees, their managers and the admins who set the policies. (payworks.ca/solutions/absence-management)
    features:

      time-off-types:
        name: Time Off Types
        status: live
        description: Unlimited time off types with company default presets.

      time-off-requests:
