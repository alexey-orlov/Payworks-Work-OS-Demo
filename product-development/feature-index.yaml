# Product map — the AREAS → FEATURES catalog. The durable half of the product graph.
#
# Structure: areas: → {area-slug} → features: → {feature-slug} → durable facts.
# An area is a product in a multi-product business, or a large functional section of
# one product. A feature belongs to exactly ONE area (move the block to re-parent —
# refs never embed the area, so nothing breaks). Feature slugs are globally unique,
# and unique against initiative slugs too (link contract: governance/link-schema.yaml).
#
# This file holds NO artifact paths and NO work state — artifacts and activity live on
# initiative pages (product/initiatives/{slug}.md, frontmatter `features:`/`areas:`
# declares the join; the OS Console rolls a feature's artifacts up through its
# initiatives). Durable facts only:
#   name:         display name
#   status:       planned | live | retired   ("in progress" is DERIVED — an active
#                 initiative targets it; /prioritize-requests reads live-ness here)
#   shipped:      YYYY-MM-DD — first GA date; written by /feature-launch-gate on PASS,
#                 the sole status writer (it flips planned → live in the same change) —
#                 except /customize-os's one-time setup seeding batch, which may seed
#                 status: live + shipped: from what the org's own site/docs show shipped
#   description:  one line, what it does for whom
#   figma:        optional stable design pointer (file ids, not display names)
#
# New entries: proposed `status: planned` in the same gated prompt as the initiative
# that introduces them (usually /product-brief-draft's registration step). Killed bets: the kill
# flow proposes removing a planned-only entry. Gated — every change needs your yes.
#
# --- Seeding provenance (this instance) ---------------------------------------------
# Areas ARE the modules — Payworks says "six integrated modules, one shared database",
# and the FY27 strategy names Expense, Perform, Onboarding and Comp as the payroll-native
# modules the portfolio expands into. Seeded once during /customize-os from:
#   · Payworks_Architecture_JTBD.pptx  — the six modules and their sub-capabilities
#   · Product_Roadmap & Company.pptx   — the 24-month roadmap (the `planned` entries)
#   · Payworks_Product_Strategy.pptx   — portfolio roles behind the descriptions
#   · payworks.ca solution pages       — public confirmation of what is shipped, and the
#                                        company's own wording (URLs on each area below)
# `shipped:` appears only where a source states a real date. The six shipped modules
# have been in market for years and their GA dates are not in any source, so their
# features carry `status: live` with no date — never a guessed one.
# ESS surfaces other modules' capabilities; each feature is catalogued under the module
# that OWNS it (config + processing), so nothing is listed twice.

areas:

  payroll:
    name: Payroll
    description: Canadian payroll processed, remitted and reported every pay period — for admins, bookkeepers and accountants. (payworks.ca/solutions/payroll)
    features:

      pay-groups:
        name: Pay Groups
        status: live
        description: Pay group setup with run schedule and approval workflow for each company.

      pay-elements:
        name: Pay Elements
        status: live
        description: Earnings, deductions, benefits and accrual elements behind every pay calculation.

      payroll-run:
        name: Payroll Run
        status: live
        description: Five-step payroll run with pre-run error resolution before submission.

      payroll-limits-and-controls:
        name: Payroll Limits & Controls
        status: live
        description: Company-level limits and controls applied to amounts entered in a payroll run.

      cra-mrq-remittances:
        name: CRA & MRQ Remittances
        status: live
        description: Tax remittances and WCB premiums filed on the employer's behalf automatically.

      roe-and-year-end:
        name: ROE & Year-End Forms
        status: live
        description: ROEs submitted directly to Service Canada; T4 and RL-1 year-end forms produced and filed.

      pay-statements:
        name: Pay Statements
        status: live
        description: Pay statements produced and distributed by print or email each run.

      direct-deposit:
        name: Direct Deposit
        status: live
        description: Employees paid straight to their bank accounts without bank files or paper cheques.

      payroll-reports:
        name: Payroll Reports
        status: live
        description: Quick Register, standard, year-end and YTD adjustment reports for reconciliation.

      gl-integration:
        name: General Ledger Integration
        status: live
        description: Journal entries and GL account mapping exported to the accounting system.

      payroll-funding:
        name: Payroll Funding & Proof of Funds
        status: live
        description: Funding and proof-of-funds handling for each payroll run.

      benefits-carrier-feeds:
        name: Benefits Carrier Feeds
        status: live
        description: Benefit deduction and enrolment data sent from payroll to benefits carriers.

      # A/B 1.0 (Multi Accounts) on the roadmap — the accountant & bookkeeper channel
      # surfaces. Parked under Payroll because both manage payroll across client
      # databases; re-parent the blocks if the team gives A/B its own module.
      payroll-hub:
        name: Payroll Hub
        status: live
        # No shipped: date — the source brief states an intended VP1 launch of
        # 2026-07-02 but nothing confirms it shipped. A date is a durable fact;
        # /feature-launch-gate writes it on a verified PASS.
        description: One dashboard showing every client's upcoming payroll obligations, for accountants and bookkeepers with 2+ client databases.

      firm-management:
        name: Firm Management
        status: planned
        # VP1 was a five-client soft launch; VP2 targets GA. Held at planned
        # until a launch gate says otherwise.
        description: Firm admin portal where an accounting or bookkeeping firm connects to client accounts and manages its team's access.

      payroll-otg:
        name: Payroll OTG
        status: planned
        description: Roadmap item on the 24-month roadmap; scope not detailed in the seeding sources.

      payroll-agent:
        name: Payroll Agent
        status: planned
        description: Roadmap AI agent for payroll, part of the platform-wide intelligence layer.

      earned-wage-access:
        name: Earned Wage Access (EWA)
        status: planned
        description: Roadmap item — earned wage access for employees.

      effective-dating-rates:
        name: Effective Dating (Rates)
        status: planned
        description: Roadmap foundation — effective-dated rate changes, limited to payroll functionality.

      union-rates:
        name: Union Rates
        status: planned
        description: Roadmap item — union pay rates, noted on the roadmap as helping CCQ.

