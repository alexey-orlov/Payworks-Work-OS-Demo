    features:

      online-timesheets:
        name: Online Timesheets
        status: live
        description: Timesheet entry and submission that flows straight through to payroll.

      web-time-clock:
        name: Web Time Clock
        status: live
        description: GPS-enabled web and mobile clock in/out for employees working away from a fixed site.

      hardware-time-clocks:
        name: Hardware & Biometric Clocks
        status: live
        description: Physical punch clocks including thermal and facial-recognition units.

      hours-and-schedule-import:
        name: Hours & Schedule Import
        status: live
        description: Employee hours and schedules imported from POS systems and punch-data files.

      scheduler:
        name: Scheduler
        status: live
        description: Week-view scheduler built from shift templates and template positions.

      generate-schedule:
        name: Automatic Schedule Generation
        status: live
        description: Schedules generated automatically from templates and employee availability.

      availability-calendar:
        name: Availability Calendar
        status: live
        description: Employee availability, including recurring availability, visible while building schedules.

      shift-and-premium-rules:
        name: Shift & Premium Rules
        status: live
        description: Configurable shift and premium rules applied to captured hours.

      overtime-and-provincial-rules:
        name: Overtime & Provincial Rules
        status: live
