      vacation-accruals:
        name: Vacation Accruals
        status: live
        description: Vacation accrual calculated automatically, with balances employees can view themselves.

      team-calendar:
        name: Shared Team Calendar
        status: live
        description: Real-time view of colleagues' shifts and time away for the whole team.

      absence-notifications:
        name: Absence Notifications
        status: live
