    description: Roadmap module (HR 1.0) — performance management beyond the review documentation Human Resources tracks today; not yet in market.
    features: {}

  onboarding:
    name: Onboarding
    description: Roadmap module (HR 2.0) — onboarding as its own module, beyond the onboarding checklists in Human Resources today; not yet in market.
    features: {}
